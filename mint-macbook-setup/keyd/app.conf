# keyd-application-mapper: per-application overrides on top of /etc/keyd/default.conf.
# Installed to ~/.config/keyd/app.conf. Window classes are lowercased by the mapper.

[xfce4-terminal]

# Mac-style clipboard/tabs in the terminal (Cmd = meta_mac layer)
meta_mac.c = C-S-c
meta_mac.v = C-S-v
meta_mac.t = C-S-t
meta_mac.w = C-S-w
meta_mac.n = C-S-n
meta_mac.f = C-S-f

# Shift+Enter: insert a newline in TUI agents (Claude Code, pi) instead of submitting.
# xfce4-terminal sends the same byte for Enter and Shift+Enter, so send Alt+Enter
# (ESC CR) instead. If an app ignores it, try: shift.enter = C-j
shift.enter = A-enter
