# keyd: Mac-style layout for the MacBook Air built-in keyboard only.
# Installed to /etc/keyd/default.conf. External keyboards are not matched,
# so they keep a plain PC layout (important for games: Ctrl, Shift, Q, Tab...).
#
# Physical keys on the Apple keyboard:  Ctrl | Option (Alt) | Cmd (Meta)
#   Ctrl   -> real Ctrl (Ctrl+C interrupts in terminals, like macOS)
#   Option -> Alt
#   Cmd    -> "meta_mac" layer: behaves as Ctrl for shortcuts (Cmd+C/V/X/Z/T/W...)
#             plus the Mac-specific extras below.

[ids]
# Apple Internal Keyboard (MacBook Air 2014). The trackpad (bcm5974) shares the
# 05ac:0291 vendor:product id, and "k:05ac:0291" still matches it (the trackpad has
# buttons, so it counts as a key device) -> keyd grabs it and the trackpad dies.
# Use the full id from `keyd monitor`; the suffix is a hash of the device name and
# capabilities, so it is stable and only matches the keyboard.
05ac:0291:f2d1f5c2

[main]
leftmeta = layer(meta_mac)
rightmeta = layer(meta_mac)

# Cmd layer; inherits the Ctrl modifier, so Cmd+<key> = Ctrl+<key> unless overridden.
[meta_mac:C]
# Cmd+Tab: window switcher. Alt+Tab is held down for as long as Cmd is held,
# so repeated Tab presses move through the list, like macOS.
tab = swapm(app_switch_state, A-tab)
# Cmd+Space: app launcher (bound to Super+Space -> Whisker menu in XFCE)
space = M-space
# Cmd+Left/Right: start/end of line; Cmd+Up/Down: start/end of document
left = home
right = end
up = C-home
down = C-end

# While switching windows: Cmd stays "Alt", Tab = next, Shift+Tab / ` / Left = previous.
[app_switch_state:A]
tab = A-tab
right = A-tab
` = A-S-tab
left = A-S-tab

# Cmd+Shift+Tab: start switching backwards
[meta_mac+shift]
tab = swapm(app_switch_state, A-S-tab)
